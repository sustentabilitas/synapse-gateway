name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # axonal is experimental, so CI pins the commit it installs.
  AXONAL_REV: 1bb1a9ea4ccdb2a11fd4e4d1c8aae6fa4b8ec1ce
  # Pull requests run only the tasks their changes can affect; main runs every task, and the
  # task cache skips those whose inputs haven't changed.
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  CRATES: -p synapse-gateway -p synapse-proxy -p synapse-mcp -p synapse-context -p synapse-a2a

jobs:
  rust:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fmt + clippy + test
            cache: check
            run: fmt lint test $CRATES
          - name: build (ledger-postgres)
            cache: postgres
            run: build-postgres
          - name: build (ledger-pubsub)
            cache: pubsub
            run: build-pubsub
          - name: build (ledger-sns)
            cache: sns
            run: build-sns
          - name: build (ledger-pubsub ledger-sns)
            cache: cloud
            run: build-cloud
          - name: build (crates + lean core)
            cache: build
            run: build build-lean $CRATES
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-ax
        with:
          cache-key: ${{ matrix.cache }}
      - name: ax run ${{ matrix.run }}
        run: ax run ${{ matrix.run }} ${{ env.AFFECTED }}

  docs:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - uses: ./.github/actions/setup-ax
        with:
          cache-key: docs
      - name: ax run test i18n typecheck build -p docs
        run: ax run test i18n typecheck build -p docs ${{ env.AFFECTED }}
